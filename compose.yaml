# Stack base (imágenes inmutables). En local se combina automáticamente con
# compose.override.yaml. Producción lo combina con compose.prod.yaml (HTTPS con
# Caddy, respaldos, valores seguros): ver docs/operacion/despliegue.md y ADR-0013.
#   docker compose -f compose.yaml -f compose.prod.yaml up -d

name: nexus

x-app: &app
  image: ${APP_IMAGE:-nexus-app}:${APP_IMAGE_TAG:-latest}
  build:
    context: .
    target: prod
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
  networks: [backend]

services:
  nginx:
    image: nginx:1.30.7-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend, backend]

  app:
    <<: *app

  queue:
    <<: *app
    # Atiende `default` antes que `bulk`: los bloques masivos (las cuentas de alumnos del SII) no retrasan los correos.
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,bulk", "--tries=3", "--backoff=10", "--max-time=3600", "--sleep=1"]
    # queue:work termina el job en curso al recibir SIGTERM (requiere pcntl)
    stop_grace_period: 60s
    healthcheck:
      disable: true

  # Tareas programadas (`Schedule::` en routes/console.php; la primera, la limpieza diaria de exportes de lo
  # publicado). Solo en producción: compose.prod.yaml le quita el perfil. En desarrollo no arranca; se corre a
  # mano con `php artisan schedule:run`.
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    profiles: [scheduler]
    stop_grace_period: 60s
    healthcheck:
      disable: true

  # Motor de horarios (fase 7, tarea 7.2): servicio Python con OR-Tools. Solo lo llama `queue` por la red `backend`
  # (http://solver:8000, con SOLVER_TOKEN); no publica puertos y el navegador nunca lo ve. Sin estado: las corridas
  # en curso viven en memoria. Detalle: services/solver/README.md y docs/arquitectura/solver.md.
  solver:
    image: ${SOLVER_IMAGE:-nexus-solver}:${SOLVER_IMAGE_TAG:-latest}
    build:
      context: ./services/solver
      target: runtime
    restart: unless-stopped
    environment:
      # Vacío = el servicio no arranca (falla cerrado). Producción lo exige en compose.prod.yaml.
      SOLVER_TOKEN: ${SOLVER_TOKEN:-}
      SOLVER_THREADS: ${SOLVER_THREADS:-2}
      SOLVER_MAX_CONCURRENT_RUNS: ${SOLVER_MAX_CONCURRENT_RUNS:-2}
      SOLVER_DEFAULT_TIME_LIMIT: ${SOLVER_DEFAULT_TIME_LIMIT:-60}
      # CP-SAT por omisión desde la 7.10; `trivial` (el motor de prueba) solo para pruebas y CI.
      SOLVER_ENGINE: ${SOLVER_ENGINE:-cpsat}
    # CPU y memoria acotadas: una corrida grande no debe quitarle recursos a la app ni a PostgreSQL.
    cpus: ${SOLVER_CPUS:-2}
    mem_limit: ${SOLVER_MEMORY:-2g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [backend]

  postgres:
    image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # PostgreSQL 18+ guarda los datos en /var/lib/postgresql/<major>/docker
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  valkey:
    image: valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]

networks:
  frontend:
  backend:

volumes:
  postgres-data:
  valkey-data:
