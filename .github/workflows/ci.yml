# CI de Nexus: lint, tests (unit, feature, arch) y browser.
# Todo corre dentro de la imagen `dev` del Dockerfile (la misma que se usa en local),
# con PostgreSQL y Valkey de compose.yaml. Detalle en docs/arquitectura/testing.md.
# Los nombres de los jobs (`lint`, `tests`, `browser`) son los checks requeridos de la tarea 0.12:
# no los renombres sin actualizar la protección de ramas. `tests` y `browser` corren en shards
# (`tests 1/3`, `browser 1/3`…, en paralelo, cada uno con su runner) y el job con el nombre requerido
# junta sus resultados: falla si algún shard falló. Solo corre en PR (y a mano): el calentado de la
# caché al mezclar vive en cache.yml, para que ningún push cree checks con estos nombres.

name: CI

on:
  # Todo PR, sin importar su rama base: un PR encadenado (base en otra feature/*)
  # también debe pasar los tres checks antes de revisarse.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-ci

      - name: Pint (verificación)
        run: docker compose run --rm -T --no-deps app ./vendor/bin/pint --test

  # Cada shard corre un tercio de las clases de prueba, repartidas por tiempo con tests/.pest/shards.json
  # (Pest, `--shard`; las clases nuevas que el archivo no trae se reparten por turno, con aviso).
  tests-shard:
    name: tests ${{ matrix.shard }}/3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Un solo job por corrida guarda las capas de la imagen.
      - uses: ./.github/actions/setup-ci
        with:
          cache-write: ${{ matrix.shard == 1 && 'true' || 'false' }}

      - name: Levantar PostgreSQL y Valkey
        run: docker compose up -d --wait postgres valkey

      # Cobertura con pcov en Clover; el job `tests` junta los de los tres shards. En paralelo, un
      # proceso por núcleo del runner: cada uno con su base nexus_test_test_<n>.
      - name: Unit, Feature y Arch (shard ${{ matrix.shard }}/3)
        run: |
          docker compose run --rm -T app php artisan test \
            --testsuite=Unit,Feature,Arch --compact \
            --parallel --processes="$(nproc)" \
            --shard=${{ matrix.shard }}/3 \
            --coverage-clover=storage/logs/clover.xml \
            --log-junit=storage/logs/junit.xml

      - name: Subir cobertura y tiempos del shard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-shard-${{ matrix.shard }}
          path: |
            storage/logs/clover.xml
            storage/logs/junit.xml
          if-no-files-found: ignore
          retention-days: 3

  # El check requerido: junta los shards. Corre siempre (`always()`), aunque un shard falle o alguien
  # cancele la corrida, y falla si alguno no pasó: un check requerido omitido, GitHub lo cuenta como
  # aprobado. Con `!cancelled()` una corrida cancelada lo dejaría omitido.
  tests:
    name: tests
    needs: tests-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bajar cobertura y tiempos de los shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tests-shard-*
          path: shards

      # Informativo: las 20 pruebas y los 10 archivos más lentos de los tres shards, en el resumen del job.
      - name: Pruebas más lentas
        run: python3 .github/scripts/slowest-tests.py shards/*/junit.xml 20 >> "$GITHUB_STEP_SUMMARY"

      # Bloqueante desde la fase 1: falla si un módulo de app/Modules/ queda debajo de 80 %. Solo con los
      # tres Clover: con un shard incompleto la cobertura saldría de menos. `shell: bash` activa pipefail.
      - name: Cobertura por módulo (mínimo 80 %)
        if: ${{ needs.tests-shard.result == 'success' }}
        shell: bash
        run: |
          python3 .github/scripts/merge-clover.py clover.xml shards/tests-shard-1/clover.xml shards/tests-shard-2/clover.xml shards/tests-shard-3/clover.xml
          .github/scripts/coverage-summary.sh clover.xml no-text-report 80 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Resultado de los shards
        if: ${{ always() }}
        run: |
          echo "Shards de tests: ${{ needs.tests-shard.result }}"
          test "${{ needs.tests-shard.result }}" = success

  browser-shard:
    name: browser ${{ matrix.shard }}/3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-ci

      - name: Restaurar caché de npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      # pest-plugin-browser busca node_modules/.bin/playwright; Chromium ya viene en la imagen.
      - name: Instalar dependencias de npm
        run: |
          mkdir -p "$HOME/.cache/ci-npm"
          docker compose run --rm -T --no-deps \
            -e npm_config_cache=/npm-cache \
            -v "$HOME/.cache/ci-npm:/npm-cache" \
            app npm ci --no-audit --no-fund

      # Los browser tests cargan el CSS y el JS compilados: la banda, la credencial y el menú no
      # funcionan sin ellos (tests/Pest.php).
      - name: Compilar CSS y JS
        run: docker compose run --rm -T --no-deps app npm run build

      - name: Levantar PostgreSQL y Valkey
        run: docker compose up -d --wait postgres valkey

      - name: Browser tests (shard ${{ matrix.shard }}/3)
        run: docker compose run --rm -T app php artisan test --testsuite=Browser --compact --shard=${{ matrix.shard }}/3

      - name: Subir capturas de los tests que fallaron
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots-${{ matrix.shard }}
          path: tests/Browser/Screenshots
          if-no-files-found: ignore

  # El check requerido: junta los shards, como `tests`.
  browser:
    name: browser
    needs: browser-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resultado de los shards
        if: ${{ always() }}
        run: |
          echo "Shards de browser: ${{ needs.browser-shard.result }}"
          test "${{ needs.browser-shard.result }}" = success
