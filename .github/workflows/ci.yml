# CI de Nexus: lint, tests (unit, feature, arch) y browser.
# Todo corre dentro de la imagen `dev` del Dockerfile (la misma que se usa en local),
# con PostgreSQL y Valkey de compose.yaml. Detalle en docs/arquitectura/testing.md.
# Los nombres de los jobs (`lint`, `tests`, `browser`) son los checks requeridos de la tarea 0.12:
# no los renombres sin actualizar la protección de ramas. `tests` y `browser` corren en shards
# (`tests 1/3`, `browser 1/3`…, en paralelo, cada uno con su runner) y el job con el nombre requerido
# junta sus resultados: falla si algún shard falló. Solo corre en PR (y a mano): el calentado de la
# caché al mezclar vive en cache.yml, para que ningún push cree checks con estos nombres.

name: CI

on:
  # Todo PR, sin importar su rama base: un PR encadenado (base en otra feature/*)
  # también debe pasar los tres checks antes de revisarse.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-ci

      - name: Pint (verificación)
        run: docker compose run --rm -T --no-deps app ./vendor/bin/pint --test

  # Cada shard corre un tercio de las clases de prueba, repartidas por tiempo con tests/.pest/shards.json
  # (Pest, `--shard`; las clases nuevas que el archivo no trae se reparten por turno, con aviso).
  solver:
    # Servicio del motor en Python (fase 7, tarea 7.12): ruff y pytest dentro de su imagen `dev`, con los fixtures
    # compartidos de tests/Fixtures/solver montados de solo lectura. No es un check requerido de develop todavía.
    name: solver
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construir la imagen dev del servicio
        run: docker build --target dev -t nexus-solver-dev services/solver

      - name: Ruff (lint y formato)
        run: docker run --rm nexus-solver-dev sh -c "ruff check . && ruff format --check ."

      # Sin la carga real (marcador `realsize`, ~1 min): `pyproject.toml` la excluye por omisión y se corre a mano
      # con `pytest -m realsize` (docs/operacion/motor.md).
      - name: Pytest
        run: docker run --rm -e SOLVER_TOKEN=ci -v "$PWD/tests/Fixtures/solver:/fixtures:ro" nexus-solver-dev pytest -q

  tests-shard:
    name: tests ${{ matrix.shard }}/3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Un solo job por corrida guarda las capas de la imagen.
      - uses: ./.github/actions/setup-ci
        with:
          cache-write: ${{ matrix.shard == 1 && 'true' || 'false' }}

      - name: Levantar PostgreSQL y Valkey
        run: docker compose up -d --wait postgres valkey

      # Cobertura con pcov en Clover; el job `tests` junta los de los tres shards. En paralelo, un
      # proceso por núcleo del runner: cada uno con su base nexus_test_test_<n>.
      - name: Unit, Feature y Arch (shard ${{ matrix.shard }}/3)
        run: |
          docker compose run --rm -T app php artisan test \
            --testsuite=Unit,Feature,Arch --compact \
            --parallel --processes="$(nproc)" \
            --shard=${{ matrix.shard }}/3 \
            --coverage-clover=storage/logs/clover.xml \
            --log-junit=storage/logs/junit.xml

      - name: Subir cobertura y tiempos del shard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-shard-${{ matrix.shard }}
          path: |
            storage/logs/clover.xml
            storage/logs/junit.xml
          if-no-files-found: ignore
          retention-days: 3

  # El check requerido: junta los shards. Corre siempre (`always()`), aunque un shard falle o alguien
  # cancele la corrida, y falla si alguno no pasó: un check requerido omitido, GitHub lo cuenta como
  # aprobado. Con `!cancelled()` una corrida cancelada lo dejaría omitido.
  tests:
    name: tests
    needs: tests-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bajar cobertura y tiempos de los shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tests-shard-*
          path: shards

      # Informativo: las 20 pruebas y los 10 archivos más lentos de los tres shards, en el resumen del job.
      - name: Pruebas más lentas
        run: python3 .github/scripts/slowest-tests.py shards/*/junit.xml 20 >> "$GITHUB_STEP_SUMMARY"

      # Bloqueante desde la fase 1: falla si un módulo de app/Modules/ queda debajo de 80 %. Solo con los
      # tres Clover: con un shard incompleto la cobertura saldría de menos. `shell: bash` activa pipefail.
      - name: Cobertura por módulo (mínimo 80 %)
        if: ${{ needs.tests-shard.result == 'success' }}
        shell: bash
        run: |
          python3 .github/scripts/merge-clover.py clover.xml shards/tests-shard-1/clover.xml shards/tests-shard-2/clover.xml shards/tests-shard-3/clover.xml
          .github/scripts/coverage-summary.sh clover.xml no-text-report 80 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Resultado de los shards
        if: ${{ always() }}
        run: |
          echo "Shards de tests: ${{ needs.tests-shard.result }}"
          test "${{ needs.tests-shard.result }}" = success

  browser-shard:
    name: browser ${{ matrix.shard }}/3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-ci

      - name: Restaurar caché de npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      # pest-plugin-browser busca node_modules/.bin/playwright; Chromium ya viene en la imagen.
      - name: Instalar dependencias de npm
        run: |
          mkdir -p "$HOME/.cache/ci-npm"
          docker compose run --rm -T --no-deps \
            -e npm_config_cache=/npm-cache \
            -v "$HOME/.cache/ci-npm:/npm-cache" \
            app npm ci --no-audit --no-fund

      # Los browser tests cargan el CSS y el JS compilados: la banda, la credencial y el menú no
      # funcionan sin ellos (tests/Pest.php).
      - name: Compilar CSS y JS
        run: docker compose run --rm -T --no-deps app npm run build

      - name: Levantar PostgreSQL y Valkey
        run: docker compose up -d --wait postgres valkey

      - name: Browser tests (shard ${{ matrix.shard }}/3)
        run: docker compose run --rm -T app php artisan test --testsuite=Browser --compact --shard=${{ matrix.shard }}/3

      - name: Subir capturas de los tests que fallaron
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots-${{ matrix.shard }}
          path: tests/Browser/Screenshots
          if-no-files-found: ignore

  # El check requerido: junta los shards, como `tests`.
  browser:
    name: browser
    needs: browser-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resultado de los shards
        if: ${{ always() }}
        run: |
          echo "Shards de browser: ${{ needs.browser-shard.result }}"
          test "${{ needs.browser-shard.result }}" = success

  # Smoke del stack de producción (ADR-0033): imágenes `prod` reales, el deployer y Caddy, con tráfico continuo
  # durante despliegues, una versión rota, un rollback y una contracción. Corre en los PR hacia `main` y en los que
  # tocan la infraestructura del despliegue; en los demás termina en segundos. Detalle en docs/arquitectura/testing.md.
  prod-smoke:
    name: prod-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ¿Toca el despliegue?
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$BASE_REF" = main ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$BASE_REF...HEAD" \
              | grep -qE '^(Dockerfile|compose[^/]*\.yaml|\.env\.production\.example|docker/|services/solver/|\.github/workflows/(ci|deploy)\.yml|\.github/scripts/(prod-smoke\.sh|smoke/)|app/Modules/Core/Health/|config/health\.php)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Este PR no toca el despliegue: el smoke del stack de producción no hace falta." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Shellcheck del deployer y de los scripts del despliegue
        if: steps.scope.outputs.run == 'true'
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            -S warning -x -P docker/deployer/lib \
            docker/deployer/bin/nexus-deploy docker/deployer/bin/nexus-bundle docker/deployer/lib/*.sh \
            .github/scripts/prod-smoke.sh docker/backup/backup.sh docker/entrypoint.prod.sh

      - name: Actionlint de los workflows
        if: steps.scope.outputs.run == 'true'
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: Configurar Buildx
        if: steps.scope.outputs.run == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Los mismos nombres que publica deploy.yml: el paquete del smoke es idéntico en forma al de producción.
      - name: Construir la imagen prod de la app
        if: steps.scope.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prod
          load: true
          tags: ghcr.io/erne1357/nexus-app:sha-${{ github.sha }}
          build-args: NEXUS_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=prod-image
          cache-to: type=gha,scope=prod-image,mode=max
          provenance: false
          sbom: false
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"

      - name: Construir la imagen del motor
        if: steps.scope.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/solver
          target: runtime
          load: true
          tags: ghcr.io/erne1357/nexus-solver:sha-${{ github.sha }}
          cache-from: type=gha,scope=solver-image
          cache-to: type=gha,scope=solver-image,mode=max
          provenance: false
          sbom: false
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"

      - name: Construir la imagen del deployer
        if: steps.scope.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/deployer
          load: true
          tags: ghcr.io/erne1357/nexus-deployer:sha-${{ github.sha }}
          cache-from: type=gha,scope=deployer-image
          cache-to: type=gha,scope=deployer-image,mode=max
          provenance: false
          sbom: false
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"

      - name: Armar el paquete del release
        if: steps.scope.outputs.run == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          docker/deployer/bin/nexus-bundle --sha "$SHA" \
            --app "ghcr.io/erne1357/nexus-app:sha-$SHA" \
            --solver "ghcr.io/erne1357/nexus-solver:sha-$SHA" \
            --deployer "ghcr.io/erne1357/nexus-deployer:sha-$SHA" \
            --repo . --out "$RUNNER_TEMP/bundle"
          ls -lh "$RUNNER_TEMP/bundle"

      - name: Smoke del stack de producción
        if: steps.scope.outputs.run == 'true'
        env:
          SHA: ${{ github.sha }}
        run: .github/scripts/prod-smoke.sh --bundle "$RUNNER_TEMP/bundle/nexus-$SHA.tar" --restart-daemon 2>&1 | tee "$RUNNER_TEMP/prod-smoke.log"

      - name: Subir el registro del smoke
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prod-smoke-log
          path: ${{ runner.temp }}/prod-smoke.log
          retention-days: 7
