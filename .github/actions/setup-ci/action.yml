name: Preparar CI
description: Construye la imagen dev (con caché de GitHub Actions), crea el .env e instala las dependencias de Composer.

inputs:
  cache-write:
    description: Guardar las capas de la imagen en la caché de Actions. Un solo job por corrida debe hacerlo.
    default: "false"

runs:
  using: composite
  steps:
    # El código se monta en /app como volumen; el usuario `app` de la imagen debe
    # tener el mismo uid/gid que el usuario del runner para poder escribir en él.
    - name: Leer uid y gid del runner
      id: ids
      shell: bash
      run: |
        echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
        echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

    - name: Configurar Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # Misma imagen y etiqueta que usa compose.override.yaml: `docker compose run`
    # la encuentra construida y no reconstruye nada.
    - name: Construir la imagen dev
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: dev
        load: true
        tags: nexus-app:dev
        build-args: |
          UID=${{ steps.ids.outputs.uid }}
          GID=${{ steps.ids.outputs.gid }}
        cache-from: type=gha,scope=dev-image
        cache-to: ${{ inputs.cache-write == 'true' && 'type=gha,scope=dev-image,mode=max' || '' }}
        provenance: false
        sbom: false
      env:
        # Sin el resumen ni el artefacto .dockerbuild que sube la action por defecto
        DOCKER_BUILD_SUMMARY: "false"
        DOCKER_BUILD_RECORD_UPLOAD: "false"

    # Mismo punto de partida que el README: .env desde .env.example con APP_KEY nueva.
    - name: Crear .env
      shell: bash
      run: |
        cp .env.example .env
        sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env

    - name: Restaurar caché de Composer
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ci-composer
        key: composer-${{ hashFiles('composer.lock') }}
        restore-keys: composer-

    - name: Instalar dependencias de Composer
      shell: bash
      env:
        COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
      run: |
        mkdir -p "$HOME/.cache/ci-composer"
        docker compose run --rm -T --no-deps \
          -e COMPOSER_AUTH -e COMPOSER_CACHE_DIR=/composer-cache \
          -v "$HOME/.cache/ci-composer:/composer-cache" \
          app composer install --no-interaction --no-progress --prefer-dist
