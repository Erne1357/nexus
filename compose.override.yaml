# Desarrollo local: código montado como volumen, Octane con --watch y Vite con HMR.

services:
  app:
    image: nexus-app:dev
    build:
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # Laravel lee .env desde el volumen; sin variables inyectadas para que
    # phpunit.xml pueda usar su propio entorno (PostgreSQL nexus_test).
    env_file: !reset []
    volumes:
      - .:/app
      # Límite de subida de las importaciones, el mismo que prod.ini.
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro

  queue:
    image: nexus-app:dev
    build:
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file: !reset []
    # queue:listen arranca un proceso por job: los cambios de código se aplican sin reiniciar. Mata
    # al proceso que pasa de --timeout, así que va por encima del job más largo (importación, 30 min).
    command: ["php", "artisan", "queue:listen", "redis", "--queue=default,bulk", "--tries=3", "--backoff=10", "--sleep=1", "--timeout=1830"]
    volumes:
      - .:/app

  postgres:
    # Solo dev: varias sesiones corren pruebas a la vez, cada una con su base, y RefreshDatabase borra y migra ~70
    # tablas por corrida; con el valor por defecto (64) salen fallas sueltas «out of shared memory» (#430).
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      # Solo dev: crea nexus_test con el volumen vacío. Producción no necesita base de pruebas.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro

  # Atrapa el correo de desarrollo y de la demo (ADR-0024): recibe por SMTP en mailpit:1025 dentro de la red y no
  # reenvía nada. La bandeja web, solo en la máquina.
  mailpit:
    image: axllent/mailpit:v1.27.0@sha256:fb84cfb1c3a33007cfdee8ba5a77b8c6c894de5b1a368372ddc5c965cf5c0b6d
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [backend]

  vite:
    image: node:24.22.1-alpine3.24@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev"]
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
    networks: [backend]
